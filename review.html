<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MANABI Review Quiz</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117;--surface:#161b22;--border:#30363d;
  --text:#e6edf3;--accent:#58a6ff;--green:#3fb950;
  --orange:#f0883e;--red:#f85149;
}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center}
h1{font-size:1.3rem;padding:16px;text-align:center;border-bottom:1px solid var(--border);width:100%;max-width:640px}
h1 span{color:var(--accent)}

/* Topic tabs */
.tabs{display:flex;flex-wrap:wrap;gap:6px;padding:12px;max-width:640px;width:100%;justify-content:center}
.tab{background:var(--surface);border:1px solid var(--border);color:var(--text);
  padding:6px 12px;border-radius:20px;font-size:.78rem;cursor:pointer;transition:.15s}
.tab:hover{border-color:var(--accent)}
.tab.active{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}

/* Stats bar */
.stats{display:flex;gap:16px;padding:8px 12px;max-width:640px;width:100%;justify-content:center;font-size:.85rem}
.stats .correct{color:var(--green)}.stats .wrong{color:var(--red)}.stats .remaining{color:var(--orange)}

/* Card area */
.card-area{max-width:640px;width:100%;padding:12px;flex:1;display:flex;flex-direction:column;align-items:center;gap:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;
  width:100%;padding:24px;cursor:pointer;min-height:200px;display:flex;flex-direction:column;
  justify-content:center;transition:border-color .2s;user-select:none;position:relative}
.card:hover{border-color:var(--accent)}
.card-label{position:absolute;top:12px;left:16px;font-size:.7rem;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}
.card .question{font-size:1.05rem;line-height:1.6}
.card .answer{font-size:.95rem;line-height:1.7;margin-top:16px;padding-top:16px;
  border-top:1px solid var(--border);color:var(--green);display:none;white-space:pre-line}
.card .hint{text-align:center;font-size:.75rem;color:var(--border);margin-top:12px}
.card.revealed .answer{display:block}
.card.revealed .hint{display:none}

/* Buttons */
.btn-row{display:flex;gap:10px;width:100%;max-width:640px;padding:0 12px}
.btn{flex:1;padding:12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);
  color:var(--text);font-size:.9rem;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--accent)}
.btn.ok{border-color:var(--green);color:var(--green)}
.btn.ng{border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.3;cursor:default}

/* Done screen */
.done{text-align:center;padding:40px 12px;max-width:640px}
.done h2{font-size:1.4rem;margin-bottom:12px}
.done .score{font-size:3rem;font-weight:700;color:var(--accent);margin:16px 0}
.done .detail{font-size:.9rem;color:var(--text);opacity:.7;margin-bottom:24px}
.restart{background:var(--accent);color:var(--bg);border:none;padding:12px 32px;border-radius:8px;
  font-size:1rem;cursor:pointer;font-weight:600}

footer{padding:16px;font-size:.7rem;color:var(--border);text-align:center}
</style>
</head>
<body>

<h1><span>MANABI</span> Review Quiz</h1>

<div class="tabs" id="tabs"></div>
<div class="stats" id="stats"></div>
<div class="card-area" id="cardArea"></div>
<div class="btn-row" id="btnRow"></div>
<footer>Tap card to reveal answer</footer>

<script>
const Q = [
// ── CPUパイプライン ──
{topic:"CPUパイプライン",q:"5段パイプラインの各段の名前と役割を述べよ。",a:"IF (Instruction Fetch): 命令メモリから命令を取得\nID (Instruction Decode): 命令を解読しレジスタ読出\nEX (Execute): ALU演算・アドレス計算\nMEM (Memory Access): データメモリの読書き\nWB (Write Back): 結果をレジスタに書戻し"},
{topic:"CPUパイプライン",q:"パイプラインハザード3種を挙げ、それぞれの原因を説明せよ。",a:"1. Structural hazard: 同一HW資源への同時アクセス競合\n2. Data hazard (RAW等): 先行命令の結果を後続命令が必要とする依存関係\n3. Control hazard: 分岐命令により次にフェッチすべき命令が不確定"},
{topic:"CPUパイプライン",q:"分岐予測ミス時のペナルティはなぜ発生し、どう軽減するか？",a:"予測ミスすると投機的にフェッチ・実行した命令をフラッシュし、正しいパスから再開する必要がある。ペナルティ ≈ 分岐解決までの段数。\n軽減策: 高精度予測器 (2-bit, gshare, TAGE)、分岐解決の前倒し、遅延分岐"},
{topic:"CPUパイプライン",q:"最適パイプライン段数を決める3つの力 (three forces) とは？",a:"1. パイプラインラッチのオーバーヘッド（段を増やすと各段にラッチ遅延が加わる）\n2. ハザードペナルティの増大（段数↑ → 分岐ペナルティ・データ依存ペナルティ↑）\n3. 段間の不均等分割（最遅段がスループットを律速する）\n→ 最適点は深すぎず浅すぎない所にある"},
{topic:"CPUパイプライン",q:"Iron Law of Processor Performance を式で示し、各項を説明せよ。",a:"Time/Program = (Instructions/Program) × (Cycles/Instruction) × (Time/Cycle)\n= Instruction Count × CPI × Clock Period\n\nInstruction Count: ISA・コンパイラが決定\nCPI: マイクロアーキテクチャが決定\nClock Period: 回路実装・プロセスが決定"},

// ── RISC-V ISA ──
{topic:"RISC-V ISA",q:"ISA (Instruction Set Architecture) とは何か？HWとSWの関係で説明せよ。",a:"ISAはハードウェアとソフトウェアの間の契約 (contract/interface)。\nプログラマが使える命令・レジスタ・メモリモデル・例外機構などを定義し、\nHW実装の自由度（パイプライン段数など）を隠蔽する抽象化層。"},
{topic:"RISC-V ISA",q:"RISC-Vの主な特徴を3つ挙げよ。",a:"1. Load-Store architecture: 演算はレジスタ間のみ、メモリアクセスはload/storeのみ\n2. 32本の汎用レジスタ (x0は常に0)\n3. モジュラー拡張: 基本ISA(RV32I)に M/A/F/D/C 等を自由に組み合わせ可能\n（加えてオープンソース・ライセンスフリー）"},
{topic:"RISC-V ISA",q:"RISC-Vの6つの命令形式 (R/I/S/B/U/J) をそれぞれ簡潔に説明せよ。",a:"R形式: レジスタ-レジスタ演算 (add, sub, and, or)\nI形式: 即値演算・load・jalr (12bit即値)\nS形式: store命令 (即値をfunct7+rdの位置に分割)\nB形式: 条件分岐 (S形式の即値配置を変えPC相対)\nU形式: 上位20bit即値 (lui, auipc)\nJ形式: ジャンプ (jal, 20bit即値でPC相対)"},
{topic:"RISC-V ISA",q:"Zicond拡張とは何か？どのような用途に有効か？",a:"Zicond: 条件付きゼロ移動命令を追加する拡張。\nczero.eqz rd,rs1,rs2 → rs2==0ならrd=rs1, さもなくばrd=0\nczero.nez rd,rs1,rs2 → rs2!=0ならrd=rs1, さもなくばrd=0\n\nブランチレスな条件選択を可能にし、分岐予測ミスを回避。\nif-conversionやcmovの代替として有効。"},
{topic:"RISC-V ISA",q:"Iron LawをRISC-V設計の文脈で説明せよ。ISA設計者が制御できる項はどれか？",a:"Time/Program = Inst Count × CPI × Clock Period\n\nISA設計者が最も影響するのは Instruction Count（命令セットの表現力）と CPI（命令の複雑さ → パイプライン効率）。\nRISC-Vはシンプルな固定長命令でCPIを低く保ちつつ、C拡張で命令密度（≒Inst Count削減）にも対処。"},

// ── シストリックアレイ ──
{topic:"シストリックアレイ",q:"シストリックアレイのPE (Processing Element) の基本構造を説明せよ。",a:"各PEは以下を持つ:\n- 乗算累積器 (MAC unit): multiply-accumulate演算\n- 重みレジスタ: weight を保持 (weight-stationaryの場合)\n- 入力/出力ポート: 隣接PEとのデータ受け渡し用\n\nPEはクロックごとに1回のMAC演算を行い、結果や入力を隣接PEへパイプライン的に流す。"},
{topic:"シストリックアレイ",q:"Weight-stationaryデータフローにおけるデータの流れを説明せよ。",a:"Weight-stationary:\n- 重み(W)は各PEに事前ロードされ固定 (stationary)\n- Activationsは左から右へ水平に流れる (→)\n- Partial sumsは上から下へ垂直に流れる (↓)\n\n各PEで a×w を計算し、上から来たpartial sumに加算して下へ渡す。"},
{topic:"シストリックアレイ",q:"Weight-stationary と Output-stationary の違いを比較せよ。",a:"Weight-stationary: Wを固定、activation/psumが流れる\n→ Wの再ロード削減、畳み込みに有利\n\nOutput-stationary: 出力(accumulator)をPEに固定、W/activationが流れる\n→ partial sumの移動削減、出力の書戻し回数最小化\n\n選択はワークロードのデータ再利用パターンに依存。"},
{topic:"シストリックアレイ",q:"アレイの段数(サイズ)を増やすとfmaxにどう影響するか？トレードオフを説明せよ。",a:"段数↑ → 配線長↑ → クリティカルパス遅延↑ → fmax↓\nまた段数↑ → 利用効率低下リスク（行列サイズがアレイに合わないと泡が発生）\n\n一方、段数↑ → 演算並列度↑ → スループット↑\nトレードオフ: 大きいアレイは理論ピーク性能は高いが、fmax低下と利用率低下で実効性能が飽和する。"},
{topic:"シストリックアレイ",q:"シストリックアレイを行列積C=A×Bに適用する場合、データの投入タイミングはどうなるか？",a:"Aの各行は1サイクルずつずらして左端から投入 (skewing)\nBの各列は1サイクルずつずらして上端から投入\n\nこのスキューにより、正しいデータペアが各PEに同時到着。\nN×Nアレイの場合、最初の出力は 2(N-1) サイクル後に右下から出る。\nパイプライン充填/排出のレイテンシがオーバーヘッドになる。"},

// ── Tensixコア ──
{topic:"Tensixコア",q:"Tensixコアの5つのRISC-Vコア (BRISC/NCRISC/TRISC) の役割を説明せよ。",a:"BRISC (Baby RISC): コア全体の制御・同期・ホスト通信\nNCRISC (NoC RISC) ×2: データムーバ。NoC経由でDRAMやL1間のデータ転送を管理\nTRISC (Tensix RISC) ×2: 演算制御。Unpack/Math/Pack の3ステージパイプラインを駆動\n\n5コアが協調してデータ移動と演算をオーバーラップ実行。"},
{topic:"Tensixコア",q:"Tensixの演算データフロー (Unpacker → FPU/SFPU → Packer) を説明せよ。",a:"1. Unpacker: L1のCircular Bufferからタイルを読み、source register(SrcA/SrcB)にデフォーマット展開\n2. FPU: 行列演算(MACなど)を実行、結果をdest registerへ\n   SFPU: element-wise演算(exp, sigmoid等)をdest上で実行\n3. Packer: dest registerからデータをフォーマット変換しL1 Circular Bufferへ書戻し"},
{topic:"Tensixコア",q:"Circular Bufferの役割と利点を説明せよ。",a:"Circular Buffer: L1メモリ上のリングバッファ構造\n- Producer (NCRISCやPacker) がページを書き込み、Consumer (UnpackerやNCRISC) がページを読み出す\n- ページ単位でsemaphoreベースの同期 (cb_push_back/cb_wait_front)\n- 利点: データ移動と演算のダブルバッファリング/パイプライン化を実現\n  → DRAMレイテンシを隠蔽し、演算ユニットの稼働率を最大化"},
{topic:"Tensixコア",q:"MetaliumプログラミングモデルでHost/Data Movement/Computeはどうマッピングされるか？",a:"Host Program: CPUで実行。カーネル起動・バッファ管理・コマンドキュー発行\nData Movement Kernel: NCRISC上で実行。NoC APIでDRAM↔L1のタイル転送を記述\nCompute Kernel: TRISC上で実行。acquire_dst/release_dst間で演算API (matmul, exp等) を記述\n\n3者はCircular Bufferを介してパイプライン的に協調。"},
{topic:"Tensixコア",q:"Tensixが1タイル(32×32)の行列積を行うとき、FPUでは何が起きるか？",a:"FPUはSrcA (1×16 activations) と SrcB (16×16 weights) を受け取り、外積ベースのMAC演算を行う。\n32×32タイルは内部的に16×16のface 4枚に分割。\n各サイクルで16×16のMAC (256 MAC ops) を実行。\n結果はdest registerに累積され、全sub-tile処理後にPackerがL1へ書き戻す。"},

// ── キャッシュコヒーレンス ──
{topic:"キャッシュコヒーレンス",q:"MSIプロトコルの3状態を説明せよ。",a:"M (Modified): このキャッシュのみが最新コピーを保持。メモリは古い（dirty）\nS (Shared): 複数キャッシュが同じクリーンなコピーを保持。メモリも最新\nI (Invalid): このキャッシュラインは無効（保持していないのと同じ）"},
{topic:"キャッシュコヒーレンス",q:"MOESI 5状態を挙げ、MSIに対する追加状態 (E, O) の意味を説明せよ。",a:"M (Modified), O (Owned), E (Exclusive), S (Shared), I (Invalid)\n\nE (Exclusive): このキャッシュのみが保持し、メモリとも一致 (clean)\n→ 書込み時にバス・トランザクション不要 (silent upgrade to M)\n\nO (Owned): このキャッシュが最新値の供給責任を持つが、他にもSコピーあり\n→ dirty handoff: メモリへの書戻しを遅延可能"},
{topic:"キャッシュコヒーレンス",q:"E状態の最大のメリット「silent upgrade」とは何か？",a:"E状態のラインに書き込む場合、他のキャッシュにコピーがないことが保証されているため、\nバス上でInvalidateメッセージを送る必要がない。\nE → M の遷移がバス・トランザクション0回で完了する。\n\nこれにより、書込みの多いプライベートデータでバス帯域を節約。\n（MSIではS→Mに必ずInvalidateが必要）"},
{topic:"キャッシュコヒーレンス",q:"O状態の「dirty handoff」のメリットを説明せよ。",a:"あるコアがMのラインを持ち、他コアが読みたい場合:\nMOESIでは M→O に遷移し、要求コアにSを渡す。\nメモリへの書戻し (writeback) を行わずにデータを共有できる。\n\nメリット: メモリ帯域の節約。Oのコアが供給責任を持ち、\n最終的にevict時にのみメモリ書戻し。\n（MSIやMESIではM→Sの際にメモリ書戻しが必要）"},
{topic:"キャッシュコヒーレンス",q:"スヌーピングプロトコルの仕組みと、ディレクトリ方式との違いは？",a:"スヌーピング: 全キャッシュが共有バスを監視 (snoop)。\nあるコアのリクエストを全コアが見て、自分の状態に応じて応答・無効化。\n→ シンプルだがバス帯域がボトルネック（コア数に対してスケールしない）\n\nディレクトリ方式: 各ラインの共有者リストをディレクトリで管理。\n必要なコアにのみポイントツーポイントでメッセージ送信。\n→ スケーラブルだがディレクトリ容量とレイテンシがオーバーヘッド。"},

// ── 物理設計 ──
{topic:"物理設計",q:"RTL-to-GDSの物理設計フロー5段階を順に説明せよ。",a:"1. Floorplan: ダイ面積決定、マクロ配置、電源計画、ピン配置\n2. Placement: スタンダードセルの配置（タイミング・面積最適化）\n3. CTS (Clock Tree Synthesis): クロック分配ツリー構築、スキュー最小化\n4. Routing: セル間の信号配線（グローバル→詳細ルーティング）\n5. Finish: フィラーセル挿入、DRC/LVS検証、寄生抽出、タイミングサインオフ"},
{topic:"物理設計",q:"タイミングスラック (slack) が劣化する主な原因を3つ挙げよ。",a:"1. 配線遅延: placement後の実配線で寄生RC増加、見積もりより遅延増\n2. クロックスキュー: CTS後にキャプチャ/ラウンチ間のスキューが不均等\n3. クロストーク: 隣接配線のスイッチングによるカップリングノイズで遅延変動\n\n他にも: IR drop (電源電圧降下)、OCV (on-chip variation)"},
{topic:"物理設計",q:"PPA tradeoff とは何か？具体例を挙げて説明せよ。",a:"PPA = Performance, Power, Area のトレードオフ\n\n例1: Vt選択 — HVTセルはリーク電力↓だが遅延↑(Performance↓)\n例2: パイプライン段数↑ → fmax↑(Performance↑)だが面積↑フリップフロップ電力↑\n例3: セル密度を上げる → Area↓だが配線混雑→タイミング悪化(Performance↓)、電力密度↑で熱問題"},
{topic:"物理設計",q:"Floorplan段階でマクロ配置が重要な理由を述べよ。",a:"マクロ（SRAM、アナログブロック等）は面積が大きく、配置が後工程に大きく影響:\n- 配線チャネルの確保: マクロ間に十分な配線領域がないとルーティング混雑\n- タイミング: マクロとロジック間の距離が配線遅延に直結\n- 電源: 大電流マクロの電源パッド近接配置でIR drop軽減\n- 熱: 発熱源の分散配置"},
{topic:"物理設計",q:"CTS (Clock Tree Synthesis) でスキュー最小化が重要な理由を説明せよ。",a:"クロックスキュー = 同じクロックエッジの異なるFF到達時刻差\n\nスキューが大きいと:\n- Setup violation: データパスに使える時間が減る (Tclk - Tskew)\n- Hold violation: スキューによりデータが早く到着しすぎる\n\nCTSはH-tree/バッファ挿入/クロックゲーティングでスキューをバランス。\n目標: 全FFにほぼ同時にクロックエッジを届ける。"},

// ── ECC設計 ──
{topic:"ECC設計",q:"SECDEDとは何か？何ビットのエラーを検出・訂正できるか？",a:"SECDED = Single Error Correction, Double Error Detection\n1ビットエラー: 検出＋訂正可能\n2ビットエラー: 検出可能（訂正不可）\n\nHamming符号に1ビットの全体パリティを追加して実現。\nデータ幅dに対し、パリティビット数p ≈ log2(d) + 2"},
{topic:"ECC設計",q:"SEU と MBU の違いを説明せよ。",a:"SEU (Single Event Upset): 放射線等により1ビットが反転するソフトエラー\n→ SECDEDで訂正可能\n\nMBU (Multi-Bit Upset): 1つの粒子が隣接する複数ビットを同時に反転\n→ SECDEDでは2ビット以上のエラー訂正不可\n\n対策: ビットインターリービング（論理的に隣接するビットを物理的に離散配置）"},
{topic:"ECC設計",q:"Hamming符号の仕組みを簡潔に説明せよ。",a:"各パリティビットは2のべき乗の位置 (1,2,4,8,...) に配置。\n各パリティビットは特定のビット群のXOR（偶数パリティ）。\n\n誤り検出: 全パリティビットを再計算し、シンドロームを生成。\nシンドロームの値 = エラー位置（0なら誤りなし）。\nシンドロームが非ゼロなら、その位置のビットを反転して訂正。"},
{topic:"ECC設計",q:"レジスタECCとメモリECCの違い・設計上の考慮点を述べよ。",a:"メモリECC: SRAM/DRAMにパリティビットを付加して格納。Read時に検査・訂正。\n→ 面積オーバーヘッド(~12.5% for SECDED on 64bit)、レイテンシ追加\n\nレジスタECC: フリップフロップにパリティを付加。毎サイクル検査可能だがゲート数↑。\n→ 高信頼用途(航空宇宙等)で使用。通常CPUではレジスタはECCなしが多い。\n\n設計判断: エラー率 × 影響度 vs 面積・電力・レイテンシコスト"},
{topic:"ECC設計",q:"ビットインターリービングがMBU対策になる理由を説明せよ。",a:"MBUは物理的に隣接するビットに同時エラーを起こす。\n\nインターリービング: 同一ECC語のビットを物理的に離散配置し、\n異なるECC語のビットを物理的に隣接させる。\n\n結果: 1つのMBUが影響するのは複数のECC語にまたがるが、\n各ECC語内ではSEU(1ビットエラー)になり、SECDEDで訂正可能。"},

// ── CHI ──
{topic:"CHI",q:"CHIの3種類のノード (RN/HN/SN) の役割を説明せよ。",a:"RN (Requesting Node): トランザクションの発行元。CPU、GPU、DMAなど。\n→ キャッシュリクエスト (ReadShared, WriteUnique等) を生成\n\nHN (Home Node): アドレスのオーナー。Snoop Filter/Directoryを管理。\n→ コヒーレンス処理、SNへの転送、RN間の順序制御\n\nSN (Subordinate Node): メモリコントローラ、周辺デバイス。\n→ HNからの要求に応じてデータ供給/格納"},
{topic:"CHI",q:"CHIの4チャネル (REQ/SNP/DAT/RSP) の役割を述べよ。",a:"REQ (Request): RN→HNへのリクエスト送信 (ReadShared, WriteUnique等)\nSNP (Snoop): HN→RNへのスヌープ要求 (SnpShared, SnpUnique等)\nDAT (Data): データ転送（任意のノード間）。RN↔HN, HN↔SN\nRSP (Response): 完了応答・Ack (SnpResp, CompAck等)\n\n各チャネルは独立しており、デッドロック回避に寄与。"},
{topic:"CHI",q:"CHIとAXIの主な違いを3つ挙げよ。",a:"1. コヒーレンス: CHIはハードウェアキャッシュコヒーレンスを内蔵、AXIは非コヒーレント\n2. トポロジ: CHIはメッシュ/リング等の柔軟なトポロジ、AXIはポイントツーポイント/バス\n3. プロトコル複雑度: CHIは4チャネル+多数のトランザクションタイプ、AXIは5チャネル(AW/W/B/AR/R)でシンプル\n\nCHIはマルチコアSoC向け、AXIは汎用インターコネクト向け"},
{topic:"CHI",q:"CHIにおけるデッドロック回避の仕組みを説明せよ。",a:"1. チャネル分離: REQ/SNP/DAT/RSPが独立キューを持ち、循環依存を防止\n   (REQがSNPをブロックしない等)\n2. レスポンス順序保証: HNがリクエスト順序を管理し、追い越しを制限\n3. クレジット制御: 送信側はクレジット取得後にのみ送信、バッファ溢れ防止\n4. リトライ機構: HNがビジーならRetryAckを返し、RN側がバックオフ再送"},
{topic:"CHI",q:"CHIのSnoop Filterとは何か？なぜ必要か？",a:"Snoop Filter: HN内のディレクトリ構造で、各キャッシュラインがどのRNに存在するかを追跡。\n\n必要性:\n- フルスヌープ（全RNにブロードキャスト）はスケールしない\n- Snoop Filterにより、実際にラインを持つRNにのみSNPを送信\n→ スヌープトラフィック大幅削減、電力・帯域節約\n\nトレードオフ: フィルタ自体のストレージ容量が必要 (area cost)"},

// ── Llamaデコーダ ──
{topic:"Llamaデコーダ",q:"Llamaデコーダの1層に含まれる9つのGEMMブロックを列挙せよ。",a:"Attention部 (4 GEMM):\n1. Q projection (Wq)\n2. K projection (Wk)\n3. V projection (Wv)\n4. Output projection (Wo)\n\nFFN部 (3 GEMM):\n5. Gate projection (Wgate)\n6. Up projection (Wup)\n7. Down projection (Wdown)\n\n正規化 (GEMM的ではないが重要):\n8. RMSNorm (Attention前)\n9. RMSNorm (FFN前)\n\n※RMSNormを除くと7 GEMMが正確。問題文の9はRMSNorm+RoPEを含む構成要素数。"},
{topic:"Llamaデコーダ",q:"Self-Attentionの計算 QK^T → softmax → ×V の流れを説明せよ。",a:"1. Q, K, V = 入力 × Wq, Wk, Wv で射影\n2. Attention Score = Q × K^T / sqrt(d_k)  — スケーリング付き内積\n3. Mask適用（因果マスク: 未来トークンを-∞に）\n4. softmax(Score) → Attention Weight（各トークンへの注意配分）\n5. Output = Attention Weight × V → 文脈を考慮した表現\n\nMulti-head: 上記をh個のheadで並列実行し結合 → Woで射影"},
{topic:"Llamaデコーダ",q:"SwiGLU FFNの構造と通常のFFNとの違いを説明せよ。",a:"通常FFN: FFN(x) = W2 · ReLU(W1 · x)\n\nSwiGLU FFN: FFN(x) = Wdown · (SiLU(Wgate · x) ⊙ (Wup · x))\n\n違い:\n- Gate機構: Wgateの出力にSiLU活性化 → Wupの出力と要素積(⊙)\n→ ゲートにより情報の通過量を制御\n- SiLU (Swish): x·σ(x) — ReLUより滑らかで学習が安定\n- GEMM数: 通常FFNは2つ、SwiGLUは3つ (gate/up/down)"},
{topic:"Llamaデコーダ",q:"Prefill phase と Decode phase の違いを説明せよ。",a:"Prefill (prompt processing):\n- プロンプト全トークンを一括処理\n- 大きな行列演算 → compute-bound (GPU利用率高)\n- KV cacheを生成・格納\n\nDecode (token generation):\n- 1トークンずつ自己回帰的に生成\n- バッチサイズ1の小さなGEMM → memory-bound (帯域律速)\n- KV cacheから過去のK,Vを読出し、新トークンのみ追加\n\nPrefillはレイテンシ、Decodeはスループット(tokens/s)が指標。"},
{topic:"Llamaデコーダ",q:"RoPE (Rotary Positional Embedding) の役割と特徴を述べよ。",a:"RoPE: Q,Kベクトルに位置依存の回転行列を適用する位置エンコーディング。\n\n特徴:\n- 相対位置情報: QK^Tの内積が (m-n) の関数になる\n→ 絶対位置ではなくトークン間の相対距離を捉える\n- 外挿性: 学習時より長いシーケンスへの一定の汎化能力\n- 計算効率: 2次元ずつペアで回転するため、コスト小\n- Llama系で標準採用"},

// ── コンパイラ ──
{topic:"コンパイラ",q:"コンパイラの3層構造 (frontend → IR → backend) を説明せよ。",a:"Frontend: ソースコード → 字句解析 → 構文解析 → 意味解析 → IR生成\n（言語依存の処理。C, Rust等ごとに異なる）\n\nIR (Intermediate Representation): 中間表現。言語にもターゲットにも依存しない。\n（LLVM IRなど。ここで最適化の大部分を実施）\n\nBackend: IR → 命令選択 → レジスタ割当 → 命令スケジューリング → 機械語生成\n（ターゲットアーキ依存の処理。x86, RISC-V等ごとに異なる）"},
{topic:"コンパイラ",q:"Loop unrollingの効果と欠点を説明せよ。",a:"効果:\n- ループオーバーヘッド削減（分岐命令・カウンタ更新の回数↓）\n- 命令レベル並列性 (ILP) の増加（独立命令が増える）\n- ソフトウェアパイプライニングの機会増加\n\n欠点:\n- コードサイズ増大 → I-cache圧迫\n- レジスタ使用量増加 → レジスタスピルのリスク\n- 効果はループ本体の命令数・依存関係に依存"},
{topic:"コンパイラ",q:"関数インライニング (inlining) の効果と判断基準を述べよ。",a:"効果:\n- 関数呼出のオーバーヘッド除去 (call/ret, スタック操作)\n- 呼出コンテキストでの最適化機会増加（定数伝播等が可能に）\n- 小さい関数では大きな速度向上\n\n判断基準:\n- 関数サイズ: 小さい関数ほどインライン向き\n- 呼出頻度: ホットパスの関数を優先\n- 再帰: 再帰関数はインライン不可（または制限付き）\n- コードサイズ予算: 過度なインラインはI-cache汚染"},
{topic:"コンパイラ",q:"If-conversion とは何か？どのような場合に有効か？",a:"If-conversion: 条件分岐を条件付き命令 (predicated instruction) や select命令に変換する最適化。\n\n例: if (c) x=a; else x=b; → x = select(c, a, b)\n\n有効な場合:\n- 分岐予測が困難な場合（予測ミスペナルティ回避）\n- then/else双方が短い場合（両方実行してもコスト小）\n- RISC-VではZicond拡張がif-conversionの恩恵を受ける\n\n不向き: 分岐先のコードが大きい場合（無駄な実行が増える）"},
{topic:"コンパイラ",q:"レジスタ割当 (Register Allocation) の課題と代表的手法を述べよ。",a:"課題: IR上の無限の仮想レジスタを有限の物理レジスタにマッピング。\n物理レジスタが足りない場合はスピル(メモリ退避)が必要→性能低下。\n\n代表的手法:\n- グラフ彩色法: 変数の干渉グラフをk色 (=レジスタ数) で彩色\n  → NP困難だがヒューリスティクスで実用的\n- 線形スキャン: 生存区間をスキャンし貪欲に割当\n  → JITコンパイラで高速性が求められる場合に使用\n- LLVM: グラフ彩色ベースの割当器を使用"},
];

const topics = [...new Set(Q.map(x=>x.topic))];
let currentTopic = null;
let deck = [];
let idx = 0;
let correct = 0, wrong = 0;
let revealed = false;

const $tabs = document.getElementById('tabs');
const $stats = document.getElementById('stats');
const $card = document.getElementById('cardArea');
const $btns = document.getElementById('btnRow');

function init(){
  $tabs.innerHTML = '';
  topics.forEach(t=>{
    const b = document.createElement('button');
    b.className = 'tab';
    b.textContent = t;
    b.onclick = ()=>startTopic(t);
    $tabs.appendChild(b);
  });
  // All topics button
  const all = document.createElement('button');
  all.className = 'tab';
  all.textContent = '全トピック';
  all.onclick = ()=>startTopic(null);
  $tabs.prepend(all);
  showWelcome();
}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*i+1|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function startTopic(t){
  currentTopic = t;
  deck = shuffle((t ? Q.filter(x=>x.topic===t) : [...Q]).slice());
  idx = 0; correct = 0; wrong = 0; revealed = false;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active', b.textContent===(t||'全トピック')));
  renderCard();
}

function renderStats(){
  const rem = deck.length - idx;
  $stats.innerHTML = `<span class="correct">correct: ${correct}</span><span class="wrong">wrong: ${wrong}</span><span class="remaining">remaining: ${rem}</span>`;
}

function renderCard(){
  if(idx >= deck.length){ showDone(); return; }
  renderStats();
  const c = deck[idx];
  $card.innerHTML = `<div class="card" id="theCard">
    <span class="card-label">${c.topic} (${idx+1}/${deck.length})</span>
    <div class="question">${esc(c.q)}</div>
    <div class="answer">${esc(c.a)}</div>
    <div class="hint">tap to reveal</div>
  </div>`;
  revealed = false;
  document.getElementById('theCard').onclick = reveal;
  $btns.innerHTML = `<button class="btn ok" disabled id="btnOk">OK</button><button class="btn ng" disabled id="btnNg">NG</button>`;
}

function reveal(){
  if(revealed) return;
  revealed = true;
  document.getElementById('theCard').classList.add('revealed');
  const ok = document.getElementById('btnOk');
  const ng = document.getElementById('btnNg');
  ok.disabled = false; ng.disabled = false;
  ok.onclick = ()=>{correct++;idx++;renderCard()};
  ng.onclick = ()=>{wrong++;idx++;renderCard()};
}

function showDone(){
  const total = correct+wrong;
  const pct = total? Math.round(correct/total*100) : 0;
  $card.innerHTML = `<div class="done"><h2>Session Complete</h2>
    <div class="score">${pct}%</div>
    <div class="detail">${correct} correct / ${wrong} wrong (${total} total)</div>
    <button class="restart" onclick="startTopic(currentTopic)">Retry</button>
    </div>`;
  $btns.innerHTML = '';
  $stats.innerHTML = '';
}

function showWelcome(){
  $card.innerHTML = `<div class="done"><h2>MANABI Review Quiz</h2>
    <div class="detail" style="margin-top:16px">上のトピックを選んで開始</div></div>`;
  $btns.innerHTML = '';
  $stats.innerHTML = '';
}

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>')}

init();
</script>
</body>
</html>
